[project]
name = "venus-datalogger"
version = "1.0"
description = "A python async service that collects data from the VENUS PLC and stores the data in an influxDB instance."
authors = [
    {name = "Jessica Rehak",email = "rehak@lbl.gov"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "ops-ecris @ git+https://github.com/lbnl-88ops/ecris.git@v0.2.2",
    "influxdb3-python (>=0.16.0,<0.17.0)",
    "typer (>=0.20.0,<0.21.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
	{ include = "venus_datalogger", from = "src" }
]

[tool.poetry.scripts]
venus-datalogger = "venus_datalogger.cli:app"

